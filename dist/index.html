<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f5ec">
  <meta name="description" content="三碗黄豆，两瓶可乐。一场高铁二等座上的隐秘挑战。">
  <title>黄豆仙人</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
 <symbol id="i-bean" viewBox="0 0 40 40"><path d="M31 7C22 0 8 6 5 18S11 36 23 34s18-19 8-27Z" fill="currentColor"/><path d="M25 12c-8-2-14 9-8 15" fill="none" stroke="#34392e" stroke-width="2.5" stroke-linecap="round"/><circle cx="25" cy="21" r="1.5" fill="#34392e"/></symbol>
 <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
 <symbol id="i-mute" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
 <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8 14-2 8 6-3 6 3-2-8m-6-7 2-2 2 2-2 2Z"/></symbol>
 <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
 <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
 <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h12c5 0 5-6 1-6-2 0-3 1-3 2M2 12h17c5 0 5 6 1 6-2 0-3-1-3-2M4 16h6c4 0 4 6 0 6"/></symbol>
 <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9c0-4 7-4 6 0-.5 2-3 2-3 5m0 3v.1"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
 <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="16" rx="4"/><path d="M5 10h14M12 3v7m-4 9-3 3m11-3 3 3M8 15h1m6 0h1"/></symbol>
</defs></svg>
<div class="page">
 <header class="topbar">
  <a class="brand" href="./" aria-label="黄豆仙人首页"><span class="brand-icon"><svg><use href="#i-bean"/></svg></span><span>黄豆仙人</span></a>
  <div class="header-actions"><button class="best" id="achievements"><svg><use href="#i-award"/></svg><span>我的最高纪录<strong><b id="best-count">0</b> <small>次</small></strong></span><span class="best-arrow">↗</span></button><button class="icon-btn" id="sound" aria-label="关闭声音" title="声音"><svg><use href="#i-sound"/></svg></button><button class="icon-btn" id="help" aria-label="玩法" title="玩法"><svg><use href="#i-help"/></svg></button></div>
 </header>
 <main>
  <div class="level-bar"><span id="level-label">第 1 关</span><div class="level-goal"><span id="level-count">0 / 10 次</span></div></div>
  <section class="game" aria-label="黄豆仙人游戏">
   <div class="start-cover" id="start-cover"><button class="start-button" id="start-game"><svg aria-hidden="true"><use href="#i-play"/></svg><span>上车，出发</span></button></div>
   <div class="scene-wrap" id="scene-wrap">
    <canvas id="scene" width="1200" height="500" role="img" aria-label="高铁二等座车厢：你坐在中间，身旁是各有心事的乘客，窗外风景不断掠过。"></canvas>
    <div class="scene-hud"><div class="trip"><span>窗外时刻</span><strong id="time">16:00</strong><button class="mini-btn" id="pause" aria-label="暂停游戏" disabled><svg><use href="#i-pause"/></svg></button></div></div>
    <div class="ambient-badge" id="ambient"><span class="signal"><i></i><i></i><i></i><i></i></span><span id="ambient-text">车轮轻响 · 一切如常</span></div>
    <div class="scene-message" id="scene-message"><span>奶奶说，黄豆不能吃太多。</span></div>
    <div class="score-card"><span>已悄悄释放</span><div><strong id="score">000</strong><span>次</span></div><div class="rank-name" id="rank-name">无名之辈</div></div>
    <div class="suspicion"><div><span>乘客怀疑</span><b id="suspicion-value">0%</b></div><div class="suspicion-track"><i id="suspicion-bar"></i></div><span id="suspicion-text">各忙各的，岁月静好</span></div>
    <div class="failure-banner" id="failure-banner" hidden role="alert"><strong>被发现了！</strong><span>邻座忍无可忍……</span></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="pause-cover" id="pause-cover" hidden><div><span class="eyebrow">稍作停留</span><h2>这口气，先憋着。</h2><button class="primary" id="resume">继续旅程 <svg><use href="#i-play"/></svg></button><button class="text-btn" id="back-home">返回候车室</button></div></div>
    <div class="progress-track"><i id="trip-progress"></i></div>
   </div>
   <div class="console">
    <div class="pressure-module"><div class="module-label"><span><svg><use href="#i-bean"/></svg> 肚子压力</span><strong><b id="pressure-value">32</b><small> / 100</small></strong></div><div class="meter pressure-meter"><i id="pressure-bar"></i><span></span><span></span><span></span></div><div class="meter-caption"><span id="pressure-caption">目前还能忍</span><span>极限</span></div></div>
    <div class="action-module"><button class="release-btn" id="release"><svg id="release-icon"><use href="#i-wind"/></svg><span id="release-label">按住，悄悄放</span></button><span class="key-hint" id="key-hint">按住 <kbd>空格</kbd> 或按钮释放 · 松开憋住</span></div>
    <div class="volume-module"><div class="module-label"><span><svg><use href="#i-wind"/></svg> 放屁音量</span><strong id="volume-status">蓄势待发</strong></div><div class="meter volume-meter" id="volume-meter"><i id="volume-bar"></i><span class="noise-limit" id="noise-limit"></span></div><div class="meter-caption"><span>轻轻的</span><span class="limit-caption">│ 环境掩护</span><span>惊天动地</span></div></div>
   </div>
  </section>
  <section class="journey"><div class="journey-heading"><h2>成仙之路</h2><button class="text-btn" id="all-achievements">称号图鉴 <span>↗</span></button></div><div class="milestones" id="milestones"></div></section>

 </main>
</div>
<dialog id="modal"><button class="icon-btn modal-close" id="modal-close" aria-label="关闭"><svg><use href="#i-close"/></svg></button><div id="modal-content"></div></dialog>
<script src="engine.js"></script><script src="scene.js"></script><script src="audio.js"></script><script src="app.js"></script>
</body></html>
